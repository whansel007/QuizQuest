<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Lab World</title>
  <link rel="stylesheet" href="/hero-lab/hud.css">
</head>
<body>
  <canvas id="world" width="1920" height="1080" aria-label="Hero Lab World game arena"></canvas>
  <aside id="hero-hud" aria-live="polite">
    <strong id="hero-name">Joining the world…</strong>
    <div class="health-row">
      <div class="health-track" role="meter" aria-label="Hero health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="health-fill"></span></div>
      <span id="health-value">-- / --</span>
    </div>
    <div id="team-health" aria-label="Teammate health" hidden></div>
  </aside>
  <aside id="wave-hud" aria-live="polite">
    <strong id="wave-number">Wave 1</strong>
    <span id="wave-details">Enemies left: --</span>
  </aside>
  <aside id="bottom-left-hud">
    <button id="info-button" type="button" aria-expanded="false" aria-controls="stats-panel">
      <span class="ability-circle info-circle">I</span><span>Information</span>
    </button>
    <section id="stats-panel" hidden aria-label="Current hero stats">
      <strong>Current stats</strong>
      <span>Health <b id="stat-health">--</b></span>
      <span>Attack <b id="stat-attack">--</b></span>
      <span>Defense <b id="stat-defense">--</b></span>
      <span>Speed <b id="stat-speed">--</b></span>
    </section>
    <span id="connection-status" role="status">Connecting…</span>
  </aside>
  <aside id="ability-hud" aria-label="Hero abilities">
    <div class="ability" data-ability="weapon"><span class="ability-circle"><span class="ability-key">M1</span></span><span class="ability-name">Weapon</span></div>
    <div class="ability" data-ability="skill"><span class="ability-circle"><span class="ability-key">E</span></span><span class="ability-name">Skill</span></div>
    <div class="ability" data-ability="ultimate"><span class="ability-circle"><span class="ability-key">Q</span></span><span class="ability-name">Ultimate</span></div>
  </aside>
  <section id="game-over" hidden>
    <h1 id="game-over-title">Game over</h1>
    <p id="game-over-message">Returning to hero selection…</p>
  </section>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/hero-lab/world.js"></script>
</body>
</html>
