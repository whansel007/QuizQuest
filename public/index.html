<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuizQuest - Circle Tag</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #111827;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
    }
    #frame { position: relative; }
    canvas {
      background: #1f2937;
      border-radius: 10px;
      border: 2px solid #374151;
      display: block;
      max-width: 95vw;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(17, 24, 39, 0.85);
      border-radius: 10px;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 20px;
    }
    #joinBtn {
      font-size: 18px;
      padding: 12px 36px;
      border: none;
      border-radius: 8px;
      background: #f59e0b;
      color: #111827;
      font-weight: bold;
      cursor: pointer;
    }
    #joinBtn:hover { background: #fbbf24; }
    #hint { font-size: 13px; color: #9ca3af; margin-top: 6px; }
    #banner {
      position: absolute;
      left: 50%;
      top: 22%;
      transform: translateX(-50%);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fbbf24;
      text-shadow: 0 0 14px rgba(251, 191, 36, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    #banner.show { opacity: 1; }
    #status { font-size: 13px; color: #9ca3af; min-height: 18px; }
    #youLabel { font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
  <div id="youLabel"></div>
  <div id="frame">
    <canvas id="game" width="900" height="600"></canvas>
    <div id="overlay">
      <div style="font-size: 26px; font-weight: 800;">Circle Tag</div>
      <button id="joinBtn">Join</button>
      <div id="hint">First circle starts as "IT". Touch the other circle to tag them.</div>
    </div>
    <div id="banner"></div>
  </div>
  <div id="status">Press Join to start</div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
